  try { await Promise.all([document.fonts.load('40px "Michroma"'), document.fonts.load('20px "Share Tech Mono"')]); } catch (e) {}
  let start = 0;
  const scenes = CFG.scenes.map((s, i) => { const kit = window.__SCENES[i]; const sc = { id: s.id, dur: s.dur, start, kit }; kit.dur = s.dur; kit.start = start; start += s.dur; return sc; });
  const DUR = start;
  for (const sc of scenes) { try { if (sc.kit.def.init) await sc.kit.def.init.call(sc.kit.def, sc.kit); } catch (e) { err.textContent += 'Scene ' + sc.id + ' failed to load: ' + e.message + '\n'; } }
  let t = 0, playing = false, last = 0, active = null;
  function show(tt) {
    t = Math.max(0, Math.min(DUR, tt));
    let sc = scenes[scenes.length - 1];
    for (const s of scenes) if (t < s.start + s.dur) { sc = s; break; }
    if (active !== sc) { if (active) active.kit.stage.style.visibility = 'hidden'; sc.kit.stage.style.visibility = 'visible'; active = sc; }
    try { sc.kit.def.render.call(sc.kit.def, t - sc.start, sc.kit); } catch (e) { err.textContent = 'Scene ' + sc.id + ' failed at ' + t.toFixed(2) + ' s: ' + e.message; }
    scrub.value = t; time.textContent = t.toFixed(2) + ' / ' + DUR.toFixed(2);
  }
  function loop(now) { if (!playing) return; t += (now - last) / 1000; last = now; if (t >= DUR) { t = DUR; playing = false; play.textContent = 'Replay'; } show(t); if (playing) requestAnimationFrame(loop); }
  function toggle() { if (playing) { playing = false; play.textContent = 'Play'; return; } if (t >= DUR) t = 0; playing = true; play.textContent = 'Pause'; last = performance.now(); requestAnimationFrame(loop); }
  play.addEventListener('click', toggle);
  scrub.addEventListener('input', () => { playing = false; play.textContent = 'Play'; show(+scrub.value); });
  addEventListener('keydown', (e) => {
    if (e.target === scrub && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { playing = false; play.textContent = 'Play'; show(t + 1 / 60); }
    else if (e.key === 'ArrowLeft') { playing = false; play.textContent = 'Play'; show(t - 1 / 60); }
  });
  show(0);
})();
</script>
