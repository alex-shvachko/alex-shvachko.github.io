<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE BLACK BOX — OBSIDIAN X-01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@300;500&family=Azeret+Mono:wght@300;500&display=block" rel="stylesheet">
<style>
/* --- the film's own stylesheet (modules/base.css) --- */
#stage { --ground:#020305; --main:#62E6FF; --second:#F4FAFF; --accent:#FFAD60; --graphite:#101318; --titanium:#242A32; --silver:#8997A5; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:400 } .sub { font-size:36px }
.mono { font-family:var(--mono, ui-monospace, monospace) }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none }
.vig { position:absolute; inset:0; background:radial-gradient(72% 74% at 50% 50%, transparent 56%, color-mix(in srgb, var(--ground) 82%, transparent)) }
.tag { position:absolute; display:flex; flex-direction:column; gap:8px; line-height:1; font-family:var(--mono, ui-monospace, monospace); white-space:nowrap }
.tag-l { transform:translateX(-100%); align-items:flex-end; text-align:right }
.tag-k { font-size:11px; letter-spacing:.34em; color:var(--main); font-weight:500 }
.tag-v { font-size:16px; letter-spacing:.24em; color:var(--second); font-weight:300 }
.tag-a .tag-k { color:var(--accent) }
.lead { fill:none; stroke:color-mix(in srgb, var(--silver) 75%, transparent); stroke-width:1 }
.dot { fill:var(--main) }
.read { position:absolute; display:flex; flex-direction:column; gap:12px; font-family:var(--mono, ui-monospace, monospace); font-size:12px; letter-spacing:.26em; line-height:1; color:var(--silver); white-space:pre }
.read > * { margin:0 }
.beam { position:absolute; left:0; height:2px; margin-top:-1px; background:linear-gradient(90deg, transparent, var(--main) 28%, var(--second) 50%, var(--main) 72%, transparent) }
.halo { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 55%, transparent), color-mix(in srgb, var(--main) 14%, transparent) 45%, transparent) }
/* --- standalone preview chrome --- */
html, body { margin:0; height:100%; background:#020305; color:#8997A5; overflow:hidden }
body { display:grid; grid-template-rows:1fr auto }
.view { position:relative; overflow:hidden }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; background:#020305; transform-origin:0 0;
  --display:'Michroma', 'Arial Black', sans-serif; --sans:'Barlow', system-ui, sans-serif; --mono:'Azeret Mono', ui-monospace, monospace }
#stage > .box { position:absolute; inset:0; display:none }
.bar { display:flex; align-items:center; gap:16px; padding:10px 18px 14px; font:12px/1 'Azeret Mono', ui-monospace, monospace; letter-spacing:.08em }
.bar button { width:34px; height:34px; border-radius:50%; border:1px solid #242A32; background:#101318; color:#F4FAFF; cursor:pointer; font:inherit }
.bar button:focus-visible, .bar input:focus-visible { outline:2px solid #62E6FF; outline-offset:2px }
.bar input { flex:1; accent-color:#62E6FF }
.bar .now { min-width:118px; color:#F4FAFF }
.bar .shot { min-width:150px; text-align:right }
</style>
</head>
<body>
<div class="view"><div id="stage"></div></div>
<div class="bar">
  <button id="play" aria-label="Play">▶</button>
  <input id="scrub" type="range" min="0" step="0.0166667" value="0" aria-label="Position in the film">
  <span class="now" id="now">0:00.00 / 0:25.00</span>
  <span class="shot" id="shot"></span>
</div>
<script>
/* --- the shared device engine (modules/shared.js) --- */
/* OBSIDIAN X-01 — shared device engine.
   One object, one coordinate system, one timeline: every scene draws the same machine with
   dev.render(G), where G is the film's own seconds (kit.start + t). Units are world units;
   the monolith is 800 x 120 x 520 (x, y, z), centred on the origin, y up. */
(function () {
  'use strict';
  const TAU = Math.PI * 2, PI = Math.PI;
  const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const sg = (t, a, b) => cl((t - a) / (b - a));
  const lp = (a, b, p) => a + (b - a) * p;
  const llp = (a, b, p) => Math.exp(lp(Math.log(a), Math.log(b), p));
  const io3 = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(2 - 2 * x, 3) / 2;
  const io5 = x => x < .5 ? 16 * Math.pow(x, 5) : 1 - Math.pow(2 - 2 * x, 5) / 2;
  const o2 = x => 1 - (1 - x) * (1 - x);
  const o3 = x => 1 - Math.pow(1 - x, 3);
  const o5 = x => 1 - Math.pow(1 - x, 5);
  const bump = (t, a, b) => t <= a || t >= b ? 0 : Math.sin((t - a) / (b - a) * PI);
  const f1 = v => Math.round(v * 10) / 10;
  const f2 = v => Math.round(v * 100) / 100;
  const f4 = v => Math.round(v * 10000) / 10000;
  const deg = r => f2(r * 180 / PI);
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function integ(K, x) {               // integral of a piecewise-linear speed profile, 0 before its first knot
    let s = 0;
    for (let i = 0; i < K.length - 1; i++) {
      const t0 = K[i][0], v0 = K[i][1], t1 = K[i + 1][0], v1 = K[i + 1][1];
      if (x <= t0) return s;
      const xe = x < t1 ? x : t1, ve = v0 + (v1 - v0) * ((xe - t0) / (t1 - t0));
      s += (xe - t0) * (v0 + ve) / 2;
      if (x < t1) return s;
    }
    const L = K[K.length - 1];
    return s + (x - L[0]) * L[1];
  }

  /* ---------------- the timeline ---------------- */
  const FZ0 = 17.22, FZ1 = 17.52;                       // everything holds still after the core pulse
  const M = G => G < FZ0 ? G : G < FZ1 ? FZ0 : G - (FZ1 - FZ0);
  const RK = [[10.2, 0], [11.3, 1], [15, 1], [17.2, 4.2], [17.23, .3], [17.7, .3], [18.3, -2], [20.6, -.6], [21.4, 0]];
  const HK = [[11, 0], [11.9, .35], [15, .35], [17.2, 3.2], [17.23, .3], [18.4, 0]];
  const FK = [[9.6, 0], [10.6, 1], [14.6, 1], [17.2, 3.4], [17.23, 1]];
  const RDIR = [1, -1, 1, -1], RMAG = [.5, .78, 1.12, 1.6], RPH = [.2, 1.1, 2.3, .7];
  const ringA = (k, G) => RPH[k] + RDIR[k] * RMAG[k] * integ(RK, M(G));
  // [open from, open to, close from, close to] — opened in "First separation", closed in "Reassembly"
  const EX = {
    locksR: [4.25, 4.75, 21.15, 21.45], locks: [4.55, 5.6, 20.55, 21.15], cover: [4.8, 6.2, 20.35, 21.05],
    pF: [5.15, 6.35, 19.95, 20.5], pR: [5.3, 6.5, 20.08, 20.63], pB: [5.45, 6.65, 20.21, 20.76], pL: [5.6, 6.8, 20.34, 20.89],
    plate2: [5.5, 6.8, 18.75, 20.1], plate1: [5.7, 7, 18.55, 19.9], boardB: [5.9, 7.2, 18.35, 19.7],
    rings: [6, 7.3, 18.1, 19.6], mods: [6.15, 7.4, 18.2, 19.45], boardA: [6.05, 7.35, 18, 19.35], chassis: [6.3, 7.6, 18.85, 20.15]
  };
  const ex = (k, G) => { const w = EX[k]; return G < 12 ? io3(sg(G, w[0], w[1])) : 1 - io5(sg(G, w[2], w[3])); };
  const DY = { chassis: -250, boardA: -150, mods: -78, boardB: 115, plate1: 185, plate2: 255, cover: 330, locks: 110 };
  function lit(G, b) {
    const a = .5 * io3(sg(G, 9.8 + b * .14, 10.9 + b * .14));
    const c = io3(sg(G, 14.4 + b * .16, 15.2 + b * .16));
    return Math.max(a, c) * (1 - .65 * sg(G, 18.1, 19.8)) * (1 - sg(G, 20.2, 20.9));
  }
  function core(G) {
    if (G < 13.55) return 0;
    let c = .28 * sg(G, 13.6, 13.85) + .42 * bump(G, 13.95, 14.6) + .72 * io3(sg(G, 14.5, 17));
    c *= 1 + .05 * Math.sin(M(G) * 7);
    return c * (1 - .4 * sg(G, 17.55, 18.3)) * (1 - sg(G, 18.6, 20.8));
  }
  const PAR = {
    slit: G => Math.max(.85 * bump(G, 1.8, 2.7), sg(G, 3.95, 4.25) * (1 - sg(G, 4.9, 5.7)), .95 * bump(G, 24, 24.8)),
    seam: G => bump(G, 4.15, 5.5),
    run: G => sg(G, 21.45, 22),
    holo: G => sg(G, 11, 11.9) * (1 - sg(G, 17.95, 18.45)),
    pulse: G => G < 17 ? 0 : o5(sg(G, 17, 17.22)),
    pulseA: G => G < 17 ? 0 : 1 - sg(G, 17.52, 17.95),
    glass: G => lp(.96, .5, ex('cover', G)),
    amber: G => .9 * bump(G, 6.3, 8.4),
    edge: G => .45 + .55 * o3(sg(G, .3, 3.6)),
    flow: G => 110 * integ(FK, M(G)),
    holoA: G => integ(HK, M(G)),
    lit, core
  };

  /* ---------------- the camera ---------------- */
  const CP = [
    { yaw: .98, pitch: .30, dist: 2400, f: 2400, tx: 0, ty: 0, tz: 0, oy: 30, roll: -.02 },
    { yaw: .66, pitch: .38, dist: 2600, f: 2340, tx: 0, ty: 0, tz: 0, oy: 10, roll: 0 },
    { yaw: .50, pitch: .44, dist: 3300, f: 2046, tx: 0, ty: 95, tz: 0, oy: 0, roll: 0 },
    { yaw: 1.70, pitch: 1.565, dist: 122, f: 276, tx: 0, ty: -22, tz: 0, oy: 0, roll: 0 },
    { yaw: 1.95, pitch: 1.565, dist: 116, f: 276, tx: 10, ty: -22, tz: -14, oy: 0, roll: 0 },
    { yaw: .62, pitch: .36, dist: 2900, f: 2200, tx: 0, ty: 0, tz: 0, oy: -165, roll: 0 }
  ];
  function mixCam(A, B, p, q) {
    const o = {};
    for (const k in A) { const pk = q && q[k] != null ? q[k] : p; o[k] = (k === 'dist' || k === 'f') ? llp(A[k], B[k], pk) : lp(A[k], B[k], pk); }
    return o;
  }
  function camAt(G) {
    if (G < 4) return mixCam(CP[0], CP[1], o2(sg(G, 0, 4)));
    if (G < 8) return mixCam(CP[1], CP[2], io3(sg(G, 4.1, 8)));
    if (G < 12.75) { const u = sg(G, 8, 12.75); return mixCam(CP[2], CP[3], io3(u), { pitch: io3(sg(u, 0, .62)) }); }
    if (G < 18) return mixCam(CP[3], CP[4], io3(sg(M(G), 12.75, 17.7)));
    const u = sg(G, 18, 21.9);
    return mixCam(CP[4], CP[5], io3(u), { pitch: io3(sg(u, .28, 1)), oy: io3(sg(u, .45, 1)) });
  }
  function View() { this.pos = [0, 0, 0]; }
  View.prototype.set = function (c) {
    const sy = Math.sin(c.yaw), cy = Math.cos(c.yaw), sp = Math.sin(c.pitch), cp = Math.cos(c.pitch);
    this.F = [-sy * cp, -sp, -cy * cp]; this.R = [cy, 0, -sy]; this.U = [-sy * sp, cp, -cy * sp];
    this.pos = [c.tx + c.dist * sy * cp, c.ty + c.dist * sp, c.tz + c.dist * cy * cp];
    this.f = c.f; this.cx = 960; this.cy = 540 + c.oy; this.cr = Math.cos(c.roll); this.sr = Math.sin(c.roll); this.c = c;
    return this;
  };
  View.prototype.P = function (x, y, z) {
    const dx = x - this.pos[0], dy = y - this.pos[1], dz = z - this.pos[2], F = this.F, R = this.R, U = this.U;
    const d = dx * F[0] + dy * F[1] + dz * F[2];
    const k = this.f / (d > .001 ? d : .001);
    const sx = (dx * R[0] + dz * R[2]) * k, sy = -(dx * U[0] + dy * U[1] + dz * U[2]) * k;
    return [this.cx + sx * this.cr - sy * this.sr, this.cy + sx * this.sr + sy * this.cr, d];
  };
  // affine of a flat face: local (u,v) -> screen, fitted through the face centre
  View.prototype.aff = function (C, U, V, hu, hv) {
    const p = this.P(C[0], C[1], C[2]);
    const a1 = this.P(C[0] + U[0] * hu, C[1] + U[1] * hu, C[2] + U[2] * hu), a0 = this.P(C[0] - U[0] * hu, C[1] - U[1] * hu, C[2] - U[2] * hu);
    const b1 = this.P(C[0] + V[0] * hv, C[1] + V[1] * hv, C[2] + V[2] * hv), b0 = this.P(C[0] - V[0] * hv, C[1] - V[1] * hv, C[2] - V[2] * hv);
    return 'matrix(' + f4((a1[0] - a0[0]) / (2 * hu)) + ',' + f4((a1[1] - a0[1]) / (2 * hu)) + ',' + f4((b1[0] - b0[0]) / (2 * hv)) + ',' + f4((b1[1] - b0[1]) / (2 * hv)) + ',' + f2(p[0]) + ',' + f2(p[1]) + ')';
  };
  const XA = [1, 0, 0], ZA = [0, 0, 1];
  View.prototype.affH = function (x, y, z, r) { return this.aff([x, y, z], XA, ZA, r, r); };

  /* ---------------- materials and light ---------------- */
  const PAL = { dk: [2, 3, 5], gr: [16, 19, 24], ti: [36, 42, 50], si: [137, 151, 165], ic: [98, 230, 255], wh: [244, 250, 255] };
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + f2(cl(a)) + ')';
  const nrm = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const LK = nrm([-.35, .6, .72]), LR = nrm([.8, .25, -.55]);
  const C0 = mixc(PAL.dk, PAL.gr, .7), C2 = mixc(PAL.ti, PAL.si, .26);
  function shade(mat, N, top, G, gain) {
    const k = Math.max(0, N[0] * LK[0] + N[1] * LK[1] + N[2] * LK[2]), r = Math.max(0, N[0] * LR[0] + N[1] * LR[1] + N[2] * LR[2]);
    const edge = rgba(mixc(PAL.si, PAL.ic, .45 * r), (.1 + .3 * k + .45 * r) * gain);
    if (mat === 'glass') return [rgba(PAL.ic, top ? .03 + .03 * k : .1), rgba(mixc(PAL.si, PAL.ic, .6), (.35 + .35 * r) * gain)];
    if (top && mat === 'smoke') return [rgba(mixc(PAL.gr, PAL.dk, .3), PAR.glass(G)), rgba(PAL.si, (.22 + .2 * k) * gain)];
    let c = k < .6 ? mixc(C0, PAL.ti, k / .6) : mixc(PAL.ti, C2, (k - .6) / .4);
    if (mat === 'pcb') c = mixc(c, PAL.dk, top ? .55 : .3);
    return [rgba(c, 1), edge];
  }

  /* ---------------- procedural detail (each part's own flat coordinates) ---------------- */
  const pt = (r, a) => f1(r * Math.cos(a)) + ' ' + f1(r * Math.sin(a));
  const CI = (x, y, r) => 'M' + f1(x - r) + ' ' + f1(y) + 'a' + r + ' ' + r + ' 0 1 0 ' + 2 * r + ' 0a' + r + ' ' + r + ' 0 1 0 ' + -2 * r + ' 0';
  const RC = (x, y, w, h) => 'M' + f1(x) + ' ' + f1(y) + 'h' + f1(w) + 'v' + f1(h) + 'h' + f1(-w) + 'z';
  const RR = (x, y, w, h, r) => 'M' + f1(x + r) + ' ' + f1(y) + 'h' + f1(w - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + 'v' + f1(h - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + r + 'h' + f1(2 * r - w) + 'a' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + -r + 'v' + f1(2 * r - h) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + -r + 'z';
  const PL = (P, z) => 'M' + P.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + (z ? 'z' : '');
  const OCT = r => PL(Array.from({ length: 8 }, (_, i) => [r * Math.cos(PI / 8 + i * PI / 4), r * Math.sin(PI / 8 + i * PI / 4)]), 1);
  const pa = (cls, d, x) => '<path class="' + cls + '" d="' + d + '"' + (x || '') + '/>';
  const band = (ra, rb, a0, a1) => 'M' + pt(ra, a0) + 'A' + ra + ' ' + ra + ' 0 0 1 ' + pt(ra, a1) + 'L' + pt(rb, a1) + 'A' + rb + ' ' + rb + ' 0 0 0 ' + pt(rb, a0) + 'z';

  function route(rnd, th, o) {                       // an octilinear trace leaving the core outward
    let d = Math.round(th / (TAU / 8)) & 7, x = Math.cos(th) * o.r0, y = Math.sin(th) * o.r0;
    const P = [[x, y]], legs = 2 + Math.floor(rnd() * 3), m = 22;
    for (let i = 0; i < legs; i++) {
      const a = d * TAU / 8, ux = Math.round(Math.cos(a) * 1e6) / 1e6, uy = Math.round(Math.sin(a) * 1e6) / 1e6;
      let L = 26 + rnd() * 120;
      if (ux) L = Math.min(L, ((ux > 0 ? o.hw - m : m - o.hw) - x) / ux);
      if (uy) L = Math.min(L, ((uy > 0 ? o.hd - m : m - o.hd) - y) / uy);
      if (L < 8) break;
      x += ux * L; y += uy * L; P.push([x, y]);
      let nd = (d + (rnd() < .5 ? 1 : 7)) & 7;
      const na = nd * TAU / 8;
      if (Math.cos(na) * x + Math.sin(na) * y < 0) nd = (nd === ((d + 1) & 7)) ? (d + 7) & 7 : (d + 1) & 7;
      d = nd;
    }
    return P;
  }
  function offs(P, o) {
    const n = P.length, N = [], out = [];
    for (let i = 0; i < n - 1; i++) { const dx = P[i + 1][0] - P[i][0], dy = P[i + 1][1] - P[i][1], l = Math.hypot(dx, dy) || 1; N.push([-dy / l, dx / l]); }
    for (let i = 0; i < n; i++) {
      let nx, ny, s = 1;
      if (i === 0) { nx = N[0][0]; ny = N[0][1]; } else if (i === n - 1) { nx = N[n - 2][0]; ny = N[n - 2][1]; }
      else { const a = N[i - 1], b = N[i]; nx = a[0] + b[0]; ny = a[1] + b[1]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l; s = 1 / Math.max(.5, nx * a[0] + ny * a[1]); }
      out.push([P[i][0] + nx * o * s, P[i][1] + ny * o * s]);
    }
    return out;
  }
  function circuits(seed, o) {
    const rnd = rng(seed), B = [[], [], [], []];
    let pads = '', vias = '';
    for (let b = 0; b < o.n; b++) {
      const th = (b + .2 + rnd() * .6) / o.n * TAU, P = route(rnd, th, o);
      if (P.length < 2) continue;
      const q = Math.min(3, Math.floor(th / (TAU / 4))), k = o.k ? o.k : 2 + Math.floor(rnd() * 4);
      for (let i = 0; i < k; i++) {
        const L = offs(P, (i - (k - 1) / 2) * 7), e = L[L.length - 1];
        B[q].push(PL(L)); pads += RC(e[0] - 2.5, e[1] - 2.5, 5, 5);
        if (!i) vias += CI(L[0][0], L[0][1], 2.6);
      }
    }
    const bands = B.map(a => a.join(''));
    return { bands, all: bands.join(''), pads, vias };
  }
  const litM = bands => '<g>' + bands.map((d, i) => pa('ox-lt', d, ' data-b="' + i + '"') + pa('ox-fl', d, ' data-b="' + i + '"')).join('') + '</g>';
  const pulseM = n => '<circle class="ox-pls" clip-path="url(#§c' + n + ')" r="1"/>';

  function boardM(seed, hole, n) {
    const o = { hw: 370, hd: 230, r0: hole ? 222 : 84, n }, c = circuits(seed, o), rnd = rng(seed + 99);
    let fine = '', smd = '', fast = '', edge = '';
    const rp = o.r0 - 9;
    for (let i = 0; i < 128; i++) { const a = i / 128 * TAU; fine += 'M' + pt(rp, a) + 'L' + pt(rp + 5, a); }
    for (let i = 0; i < 54; i++) {
      const x = (rnd() * 2 - 1) * 330, y = (rnd() * 2 - 1) * 196;
      if (Math.hypot(x, y) < o.r0 + 20) continue;
      smd += rnd() < .5 ? RC(x, y, 7, 3.5) + RC(x, y + 5, 7, 3.5) : RC(x, y, 3.5, 7) + RC(x + 5, y, 3.5, 7);
    }
    for (const s of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { const x = s[0] * 350, y = s[1] * 210; fast += CI(x, y, 7) + 'M' + (x - 4) + ' ' + y + 'h8M' + x + ' ' + (y - 4) + 'v8'; }
    for (let x = -190; x <= 190; x += 10) edge += RC(x - 2.5, 214, 5, 10);

    const out = seg(G, 12.68, 12.95);
    this.ring.render(d.at('R0', 134, 3, -134), seg(G, 11.3, 12.0), out);
    for (let i = 0; i < this.rows.length; i++) {
      const p = eo(seg(G, 11.5 + i * .12, 11.9 + i * .12)), s = this.rows[i].style;
      s.clipPath = 'inset(0 ' + ((1 - p) * 100).toFixed(1) + '% 0 0)';
      s.opacity = (p > 0 ? 1 - out : 0).toFixed(3);
    }
  }
});

  },
  "core": function (kit) {
const { seg, eio, lerp } = kit;
const TAU = Math.PI * 2;
function energy() {           // drawn flat in the plane just above the core, in its own units
  const pt = (r, a) => (r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1);
  let t = '', arcs = '';
  for (let i = 0; i < 72; i++) { const a = i / 72 * TAU, L = i % 6 ? 6 : 12; t += 'M' + pt(L > 6 ? 78 : 81, a) + 'L' + pt(L > 6 ? 90 : 87, a); }
  for (let j = 0; j < 6; j++) { const a = j / 6 * TAU; arcs += 'M' + pt(100, a) + 'A100 100 0 0 1 ' + pt(100, a + .42); }
  return '<circle class="ox-holo" r="74"/><g class="core-a"><path class="ox-holo2" d="' + t + '"/></g>' +
    '<g class="core-b"><path class="ox-holo2" d="' + arcs + '"/></g><path class="ox-holo core-v"/>' +
    '<circle class="ox-holo" r="124" stroke-dasharray="3 9"/><circle class="ox-pls core-p" r="70"/>';
}
kit.scene('core', {
  init(kit) {
    this.k0 = kit.start;
    kit.stage.append(kit.h('<div class="ground"></div>'));
    this.dev = OBX.build(kit, 'cor', { planes: [{ n: 'en', y: 0, m: energy() }] });
    const q = s => this.dev.svg.querySelector(s);
    this.ga = q('.core-a'); this.gb = q('.core-b'); this.vec = q('.core-v'); this.pl = q('.core-p');
    kit.stage.append(kit.h('<div class="vig"></div>'));
    kit.stage.append(kit.h('<div class="halo core-flash" style="width:1200px;height:1200px"></div>'));
    this.flash = kit.stage.querySelector('.core-flash').style;
    const svg = kit.h('<svg class="art" viewBox="0 0 1920 1080"></svg>');
    kit.stage.append(svg);
    this.tags = [
      { p: [-42.4, -14, 42.4], t: 14.55, tag: OBX.tag(kit, svg, { k: '01', v: 'CORE SYNCHRONIZATION', x: 560, y: 300, side: 'l' }) },
      { p: [0, -15, -157], t: 15.25, tag: OBX.tag(kit, svg, { k: '02', v: 'ENERGY TRANSFER', x: 1480, y: 730 }) },
      { p: [134, -20, 134], t: 15.95, tag: OBX.tag(kit, svg, { k: '03', v: 'SYSTEM INTEGRITY', x: 330, y: 860, side: 'l' }) }
    ];
    kit.stage.append(kit.h('<div class="mono core-num" style="position:absolute;left:330px;top:884px;transform:translateX(-100%);font-size:34px;letter-spacing:.12em;color:var(--main);line-height:1">100%</div>'));
    this.num = kit.stage.querySelector('.core-num');
  },
  render(t) {
    const G = this.k0 + t, M = OBX.M(G), en = this.dev.items.en;
    const o = seg(G, 14.6, 15.3) * (1 - seg(G, 17.6, 17.95));
    en.o = o * (.55 + .45 * seg(G, 15.5, 17));
    const d = this.dev.render(G);
    if (o > 0) {
      this.ga.setAttribute('transform', 'rotate(' + (OBX.ringA(3, G) * 80).toFixed(2) + ')');
      this.gb.setAttribute('transform', 'rotate(' + (-OBX.ringA(2, G) * 63).toFixed(2) + ')');
      let v = '';
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * TAU, L = 10 + 26 * (.5 + .5 * Math.sin(M * 5.3 + i * 1.9)) * seg(G, 15, 16.5);
        v += 'M' + (132 * Math.cos(a)).toFixed(1) + ' ' + (132 * Math.sin(a)).toFixed(1) + 'L' + ((132 + L) * Math.cos(a)).toFixed(1) + ' ' + ((132 + L) * Math.sin(a)).toFixed(1);
      }
      this.vec.setAttribute('d', v);
      this.pl.setAttribute('r', lerp(70, 1100, OBX.PAR.pulse(G)).toFixed(1));
      this.pl.style.opacity = OBX.PAR.pulseA(G).toFixed(3);
    }
    // the release: one bright pulse at 17 s, held through the freeze
    const c = d.P(0, -14, 0), f = G >= 17 ? .6 * (1 - seg(M, 17, 17.75)) : 0;
    this.flash.left = (c[0] - 600).toFixed(1) + 'px'; this.flash.top = (c[1] - 600).toFixed(1) + 'px'; this.flash.opacity = f.toFixed(3);
    const out = seg(G, 17.55, 17.9);
    for (const g of this.tags) g.tag.render(d.P(g.p[0], g.p[1], g.p[2]), seg(G, g.t, g.t + .7), out);
    const n = seg(G, 16.25, 16.95);
    this.num.textContent = Math.round(lerp(52, 100, eio(n))) + '%';
    this.num.style.opacity = (seg(G, 16.2, 16.4) * (1 - out)).toFixed(3);
  }
});

  },
  "rebuild": function (kit) {
const { seg, eo, lerp } = kit;
kit.scene('rebuild', {
  init(kit) {
    this.k0 = kit.start;
    kit.stage.append(kit.h('<div class="ground"></div>'));
    this.dev = OBX.build(kit, 'reb');
    kit.stage.append(kit.h('<div class="vig"></div>'));
    let c = '';
    for (let i = 0; i < 10; i++) c += '<circle class="lead reb-c" r="1"/>';
    const svg = kit.h('<svg class="art" viewBox="0 0 1920 1080">' + c + '</svg>');
    kit.stage.append(svg);
    this.rings = Array.from(svg.querySelectorAll('.reb-c'));
    // what snaps home, and when: six modules into their sockets, then the four locks
    this.snaps = [0, 1, 2, 3, 4, 5].map(i => ({ n: 'm' + i, dy: 4, t: 19.42, r: 30 }))
      .concat([0, 1, 2, 3].map(i => ({ n: 'k' + i, dy: 4, t: 21.45, r: 48 })));
  },
  render(t) {
    const G = this.k0 + t, d = this.dev.render(G);
    for (let i = 0; i < this.snaps.length; i++) {
      const s = this.snaps[i], el = this.rings[i], p = seg(G, s.t, s.t + .42);
      const a = p > 0 && p < 1 ? (1 - p) * .9 : 0;
      el.style.opacity = a.toFixed(3);
      if (!a) continue;
      const q = d.at(s.n, 0, s.dy, 0);
      el.setAttribute('cx', q[0].toFixed(1)); el.setAttribute('cy', q[1].toFixed(1));
      el.setAttribute('r', lerp(6, s.r, eo(p)).toFixed(1));
      el.style.stroke = 'var(--main)';
    }
  }
});

  },
  "reveal": function (kit) {
const { seg, eo, eio, lerp } = kit;
const LY = 640;
kit.scene('reveal', {
  init(kit) {
    this.k0 = kit.start;
    kit.stage.append(kit.h('<div class="ground"></div>'));
    this.dev = OBX.build(kit, 'rev');
    kit.stage.append(kit.h('<div class="vig"></div>'));
    kit.css('.rev-glow{fill:none;stroke:color-mix(in srgb, var(--main) 30%, transparent);stroke-width:6;stroke-linejoin:round}' +
      '.rev-edge{fill:none;stroke:var(--main);stroke-width:1.6;stroke-linejoin:round}' +
      '.rev-line{stroke:var(--main);stroke-width:1.5}' +
      '.rev-words{left:0;width:1920px;top:668px;align-items:center;gap:0}' +
      '.rev-m{overflow:hidden;padding:4px 0 8px}' +
      '.rev-name{margin:0;font-size:112px;line-height:1;color:var(--second);white-space:nowrap}' +
      '.rev-sub{margin-top:30px!important;font-size:22px;font-weight:500;letter-spacing:.5em;padding-left:.5em;color:var(--silver);white-space:pre}' +
      '.rev-tag{margin-top:22px!important;font-family:var(--mono, ui-monospace, monospace);font-size:12px;letter-spacing:.62em;padding-left:.62em;color:var(--main)}');
    const svg = kit.h('<svg class="art" viewBox="0 0 1920 1080"><path class="rev-glow"/><path class="rev-edge"/>' +
      '<line class="rev-line" y1="' + LY + '" y2="' + LY + '"/><circle class="dot rev-head" r="3.5"/><circle class="lead rev-ring" r="9"/></svg>');
    kit.stage.append(svg);
    const q = s => svg.querySelector(s);
    this.glow = q('.rev-glow'); this.edge = q('.rev-edge'); this.line = q('.rev-line'); this.head = q('.rev-head'); this.ring = q('.rev-ring');
    kit.stage.append(kit.h('<div class="words rev-words"><div class="rev-m"><h1 class="line rev-name">OBSIDIAN</h1></div>' +
      '<p class="rev-sub">X-01  /  ADVANCED COMPUTATIONAL CORE</p><p class="rev-tag">ENGINEERED BEYOND LIMITS</p></div>'));
    const w = s => kit.stage.querySelector(s).style;
    this.words = w('.rev-words'); this.name = w('.rev-name'); this.sub = w('.rev-sub'); this.tg = w('.rev-tag');
  },
  render(t) {
    const d = this.dev.render(this.k0 + t);
    // the silhouette, starting from its lowest corner
    let H = d.hull(), b = 0;
    for (let i = 1; i < H.length; i++) if (H[i][1] > H[b][1]) b = i;
    H = H.slice(b).concat(H.slice(0, b)); H.push(H[0]);
    let L = 0; const seglen = [];
    for (let i = 1; i < H.length; i++) { const s = Math.hypot(H[i][0] - H[i - 1][0], H[i][1] - H[i - 1][1]); seglen.push(s); L += s; }
    const dpath = 'M' + H.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
    const p = eio(seg(t, .05, .95)), op = (p > 0 ? 1 : 0) * (1 - .85 * seg(t, .95, 1.6));
    for (const el of [this.glow, this.edge]) {
      el.setAttribute('d', dpath); el.style.strokeDasharray = (L * p).toFixed(1) + ' ' + (L + 10).toFixed(1); el.style.opacity = op.toFixed(3);
    }
    // the head of the trace, then the line that leaves the object
    let hx, hy, k = L * p, i = 0;
    while (i < seglen.length - 1 && k > seglen[i]) { k -= seglen[i]; i++; }
    const f = seglen[i] ? Math.min(1, k / seglen[i]) : 0;
    hx = lerp(H[i][0], H[i + 1][0], f); hy = lerp(H[i][1], H[i + 1][1], f);
    const B = H[0], drop = eio(seg(t, .95, 1.2));
    if (t > .95) { hx = B[0]; hy = lerp(B[1], LY, drop); }
    const hv = seg(t, 0, .08) * (1 - seg(t, 1.2, 1.35));
    for (const el of [this.head, this.ring]) { el.setAttribute('cx', hx.toFixed(1)); el.setAttribute('cy', hy.toFixed(1)); el.style.opacity = hv.toFixed(3); }
    const s = eo(seg(t, 1.15, 1.7));
    this.line.setAttribute('x1', lerp(B[0], 400, s).toFixed(1)); this.line.setAttribute('x2', lerp(B[0], 1520, s).toFixed(1));
    this.line.style.opacity = (s > 0 ? 1 - .45 * seg(t, 2.2, 3) : 0).toFixed(3);
    // OBSIDIAN rises out of the line; the designation opens from the centre
    const n = eo(seg(t, 1.3, 1.95)), sp = lerp(.58, .36, eo(seg(t, 1.3, 2.5)));
    this.name.transform = 'translateY(' + ((1 - n) * -110).toFixed(2) + '%)';
    this.name.letterSpacing = sp.toFixed(4) + 'em'; this.name.paddingLeft = sp.toFixed(4) + 'em';
    const c = (1 - eo(seg(t, 1.75, 2.3))) * 50;
    this.sub.clipPath = 'inset(0 ' + c.toFixed(2) + '% 0 ' + c.toFixed(2) + '%)';
    const g = eo(seg(t, 2.05, 2.5));
    this.tg.opacity = g.toFixed(3); this.tg.transform = 'translateY(' + ((1 - g) * 8).toFixed(1) + 'px)';
    this.words.transform = 'translateY(' + (-2 * Math.max(0, t - 1.3)).toFixed(2) + 'px)';
  }
});

  }
  };
  /* a minimal stand-in for the Motion player's kit: enough for these modules (no sound) */
  const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const helpers = {
    clamp01: cl, seg: (t, a, b) => cl((t - a) / (b - a)), lerp: (a, b, p) => a + (b - a) * p,
    eo: x => 1 - Math.pow(1 - x, 3), ei: x => x * x * x, eio: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
  };
  const stage = document.getElementById('stage'), tpl = document.createElement('template');
  const list = [];
  let start = 0;
  for (const s of FILM.scenes) {
    const box = document.createElement('div'); box.className = 'box'; stage.append(box);
    const entry = { id: s.id, name: s.name, start, dur: s.dur, box, def: null };
    const kit = Object.assign({}, helpers, {
      stage: box, start, dur: s.dur, W: FILM.width, H: FILM.height,
      h: html => { tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; },
      css: text => { const st = document.createElement('style'); st.textContent = text; box.append(st); },
      scene: (id, def) => { entry.def = def; }, score: () => {}
    });
    entry.kit = kit; SCENES[s.id](kit);
    list.push(entry); start += s.dur;
  }
  const END = start;
  const scrub = document.getElementById('scrub'), now = document.getElementById('now'), shot = document.getElementById('shot'), play = document.getElementById('play');
  scrub.max = END;
  const fmt = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(2).padStart(5, '0');
  let ready = false, active = null;
  function draw(T) {
    if (!ready) return;
    T = Math.max(0, Math.min(END, T));
    let e = list[0];
    for (const x of list) if (T >= x.start) e = x;
    if (e !== active) { if (active) active.box.style.display = 'none'; e.box.style.display = 'block'; active = e; }
    e.def.render.call(e.def, T - e.start, e.kit);
    scrub.value = T; now.textContent = fmt(T) + ' / ' + fmt(END); shot.textContent = e.name;
  }
  function fit() {
    const v = stage.parentElement, k = Math.min(v.clientWidth / FILM.width, v.clientHeight / FILM.height);
    stage.style.transform = 'translate(' + (v.clientWidth - FILM.width * k) / 2 + 'px,' + (v.clientHeight - FILM.height * k) / 2 + 'px) scale(' + k + ')';
  }
  let T = 0, playing = false, last = 0;
  const hash = /t=([\d.]+)/.exec(location.hash);
  if (hash) T = +hash[1];
  function setPlaying(p) { playing = p; play.textContent = p ? '❚❚' : '▶'; play.setAttribute('aria-label', p ? 'Pause' : 'Play'); last = performance.now(); if (p && T >= END) T = 0; }
  function tick(now_) { if (playing) { T += (now_ - last) / 1000; last = now_; if (T >= END) { T = END; setPlaying(false); } draw(T); } requestAnimationFrame(tick); }
  play.onclick = () => setPlaying(!playing);
  scrub.oninput = () => { T = +scrub.value; draw(T); };
  addEventListener('keydown', ev => {
    if (ev.target === scrub && ev.key.startsWith('Arrow')) return;
    if (ev.key === ' ') { ev.preventDefault(); setPlaying(!playing); }
    if (ev.key === 'ArrowRight') { T = Math.min(END, T + 1 / 60); draw(T); }
    if (ev.key === 'ArrowLeft') { T = Math.max(0, T - 1 / 60); draw(T); }
  });
  addEventListener('resize', fit); fit();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(async () => {
    for (const e of list) await e.def.init.call(e.def, e.kit);
    ready = true; draw(T);
    const still = !!hash || matchMedia('(prefers-reduced-motion: reduce)').matches;
    setPlaying(!still);
    requestAnimationFrame(tick);
  });
})();
</script>
</body>
