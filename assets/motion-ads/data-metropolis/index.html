<!doctype html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>

  #bar { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-top: 1px solid #0f2233; font-size: 13px; }
  #bar button { font: inherit; color: #03070D; background: #4DE5FF; border: 0; border-radius: 3px; padding: 6px 14px; min-width: 72px; cursor: pointer; }
  #bar button:focus-visible, #scrub:focus-visible { outline: 2px solid #FFB86B; outline-offset: 3px; }

#stage { --ground:#03070D; --main:#4DE5FF; --second:#ECF4FA; --accent:#FFB86B; color:var(--second); font-family:var(--mono, ui-monospace, monospace) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:120px; line-height:1; font-weight:300; letter-spacing:.02em } .sub { font-size:28px; letter-spacing:.32em }

.title { width:880px; font-size:100px; line-height:1.04; letter-spacing:.05em; color:var(--second) }
.tagline { font-size:24px; font-weight:400; letter-spacing:.42em; color:color-mix(in srgb, var(--main) 78%, var(--second)); display:flex; align-items:center; gap:22px; white-space:nowrap }
.tagline::before { content:''; display:block; width:56px; height:2px; background:var(--accent) }

</style>
</head>

</div>
